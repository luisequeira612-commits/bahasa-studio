name: MMS A1 listening samples

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mms-a1-listening-samples
  cancel-in-progress: false

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      PIP_NO_CACHE_DIR: "1"
      BAHASA_TTS_MODEL_CACHE: ${{ runner.temp }}/guardi-mms-samples-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install MMS CPU dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir "transformers>=4.45,<5" sentencepiece scipy huggingface_hub

      - name: Generate 30 A1 phrases and three pronunciation variants
        run: |
          rm -rf audio-samples
          python scripts/generate_audio.py --engine mms --mode samples --level A1 --limit 30 --include-pronunciation-variants --force

      - name: Upload listening pack
        uses: actions/upload-artifact@v4
        with:
          name: guardi-mms-a1-samples-${{ github.run_number }}
          path: audio-samples/
          if-no-files-found: error
          retention-days: 7
