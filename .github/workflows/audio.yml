name: Generate multilingual Piper audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'curriculum-*.js'
      - 'languages/**/curriculum/**'
      - 'language-manager.js'
      - 'tools/audio-voices.json'
      - 'scripts/export-audio-manifest.mjs'
      - 'tools/generar_audio.py'
      - '.github/workflows/audio.yml'

permissions:
  contents: write

concurrency:
  group: guardi-piper-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Piper and ffmpeg
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir piper-tts==1.3.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate missing multilingual audio
        run: python tools/generar_audio.py
      - name: Validate GitHub size limits
        run: |
          total=$(du -sb audio | cut -f1)
          echo "Audio total: $total bytes"
          echo "Audio total (MiB): $(awk -v bytes="$total" 'BEGIN { printf "%.2f", bytes / 1048576 }')"
          # Keep a 500 MiB safety budget for the complete static audio library.
          test "$total" -lt 524288000
          while IFS= read -r file; do
            test "$(stat -c%s "$file")" -lt 104857600
          done < <(find audio -type f)
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && exit 0
          git commit -m "audio: generate multilingual Piper library"
          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            echo "Push concurrente; reintentando ($attempt/5)..."
            sleep 2
          done
          echo "No se pudo publicar el audio tras cinco intentos."
          exit 1
