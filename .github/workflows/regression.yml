name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run regression tests
        run: node --test tests/regression.test.cjs
      - name: Run vocabulary review browser tests
        run: node --test tests/vocabulary-review.e2e.test.cjs
      - name: Run practical conversation unit tests
        run: node --test tests/conversation-practice.test.cjs
      - name: Run KBBI audit queue tests
        run: node --test tests/audit-kbbi-pending.test.mjs
      - name: Run assessment engine unit tests
        run: node --test tests/assessment-engine.test.cjs
      - name: Run progressive assessment unit tests
        run: node --test tests/progressive-assessment.test.cjs
      - name: Run multi-lesson progression tests
        run: node --test tests/multi-lesson-progression.test.cjs
      - name: Run real-browser end-to-end tests
        run: node --test tests/browser-e2e.test.cjs
      - name: Run assessment page browser tests
        run: node --test tests/assessment-page.e2e.test.cjs
      - name: Package a downloadable static preview for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bahasa-studio-pr-${{ github.event.pull_request.number }}-preview
          path: |
            index.html
            assessment.html
            assessment-engine.js
            conversation-engine.js
            manifest.json
          if-no-files-found: error
          retention-days: 7
