name: Probe published audio Range responses

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start execution timer
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Probe normal GET and byte-range GET against GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url="https://luisequeira612-commits.github.io/bahasa-studio/audio/id/00205de28847.mp3"

          probe() {
            local label="$1"
            shift
            local headers
            headers="$(mktemp)"
            local status
            status="$(curl --silent --show-error --location --max-time 30 \
              --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$@" "$url")"
            echo "::group::${label} (HTTP ${status})" >&2
            cat "$headers" >&2
            echo "::endgroup::" >&2
            rm -f "$headers"
            printf '%s' "$status"
          }

          normal="$(probe 'Normal GET' )"
          range="$(probe 'Range GET' --header 'Range: bytes=0-1')"
          identity="$(probe 'Range GET with identity encoding' --header 'Range: bytes=0-1' --header 'Accept-Encoding: identity')"

          echo "Normal GET status: ${normal}"
          echo "Range GET status: ${range}"
          echo "Range + identity status: ${identity}"

          [[ "$normal" == "200" ]]
          [[ "$range" == "200" || "$range" == "206" ]]
          [[ "$identity" == "200" || "$identity" == "206" ]]

      - name: Report runtime
        if: always()
        env:
          STARTED: ${{ steps.clock.outputs.started }}
        run: |
          MINUTES="$(python -c 'import os,time; print(round((time.time()-int(os.environ.get("STARTED","0")))/60,2))')"
          echo "- Tiempo transcurrido del runner: **${MINUTES} minutos aprox.**" >> "$GITHUB_STEP_SUMMARY"
