name: Generate multilingual Piper audio

on:
  workflow_dispatch:
  push:
    paths:
      - 'curriculum-*.js'
      - 'languages/**/curriculum/**'
      - 'language-manager.js'
      - 'tools/audio-voices.json'
      - 'scripts/export-audio-manifest.mjs'
      - 'tools/generar_audio.py'

permissions:
  contents: write

concurrency:
  group: guardi-piper-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Piper and ffmpeg
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir piper-tts==1.3.0
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Generate missing multilingual audio
        run: python tools/generar_audio.py
      - name: Validate GitHub size limits
        run: |
          total=$(du -sb audio | cut -f1)
          echo "Audio total: $total bytes"
          test "$total" -lt 1073741824
          while IFS= read -r file; do
            test "$(stat -c%s "$file")" -lt 104857600
          done < <(find audio -type f)
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && exit 0
          git commit -m "audio: generate multilingual Piper library"
          git push
