name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run regression tests
        run: node --test tests/regression.test.cjs
      - name: Run unbiased exercise shuffle tests
        run: node --test tests/exercise-shuffle.test.cjs
      - name: Run Gemini request error handling tests
        run: node --test tests/gemini-request.test.cjs
      - name: Run phase 1 UI navigation tests
        run: node --test tests/ui-redesign-phase-1.test.cjs
      - name: Run phase 2 lesson flow tests
        run: node --test tests/ui-redesign-phase-2.test.cjs
      - name: Run phase 3 touch and theme tests
        run: node --test tests/ui-redesign-phase-3.test.cjs
      - name: Run phase 4 learning screen browser tests
        run: node --test tests/learning-screen-phase-4.e2e.test.cjs
      - name: Upload phase 4 mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learning-screen-phase-4-mobile-captures
          path: artifacts/phase-4/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Run preview artifact coverage tests
        run: node --test tests/preview-artifact.test.cjs
      - name: Run vocabulary review browser tests
        run: node --test tests/vocabulary-review.e2e.test.cjs
      - name: Run practical conversation unit tests
        run: node --test tests/conversation-practice.test.cjs
      - name: Run study activity unit tests
        run: node --test tests/study-activity.test.cjs
      - name: Run local study history tests
        run: node --test tests/study-history.test.cjs
      - name: Run adaptive learning recommendation tests
        run: node --test tests/adaptive-learning.test.cjs
      - name: Run A2 curriculum structure tests
        run: node --test tests/a2-curriculum.test.cjs
      - name: Run A2 U5-U8 lesson focus tests
        run: node --test tests/a2-u5-u8-lesson-focus.test.cjs
      - name: Run A2 U12 lesson focus alignment tests
        run: node --test tests/a2-u12-lesson-focus.test.cjs
      - name: Run A2 U14 Spanish copy tests
        run: node --test tests/a2-u14-copy.test.cjs
      - name: Run A2 U20 lesson focus tests
        run: node --test tests/a2-u20-lesson-focus.test.cjs
      - name: Run A2 U21-U24 lesson focus tests
        run: node --test tests/a2-u21-u24-lesson-focus.test.cjs
      - name: Run A2 U25-U28 lesson focus tests
        run: node --test tests/a2-u25-u28-lesson-focus.test.cjs
      - name: Run A2 U29-U32 lesson focus tests
        run: node --test tests/a2-u29-u32-lesson-focus.test.cjs
      - name: Run A2 U33-U40 lesson focus tests
        run: node --test tests/a2-u33-u40-lesson-focus.test.cjs
      - name: Run A1 curriculum progression guardrails
        run: node --test tests/a1-curriculum-progression.test.cjs
      - name: Run A1 U24-U32 lesson focus guardrails
        run: node --test tests/a1-u24-u32-lesson-focus.test.cjs
      - name: Run A1 listening coverage guardrail
        run: node --test tests/a1-listening-coverage.test.cjs
      - name: Run A1 U25 Menonton context tests
        run: node --test tests/a1-u25-menonton-context.test.cjs
      - name: Run A1/A2 exercise vocabulary alignment tests
        run: node --test tests/exercise-vocabulary-alignment.test.cjs
      - name: Run exercise answer-to-vocabulary alignment tests
        run: node --test tests/exercise-answer-vocabulary-alignment.test.cjs
      - name: Run offline vocabulary report
        run: node scripts/vocabulary-report.mjs
      - name: Run offline curriculum lint (B1/B2 blocking, I1-I5 informational)
        run: node scripts/lint-curriculum.mjs
      - name: Upload vocabulary and curriculum lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-and-curriculum-lint-pr-${{ github.event.pull_request.number || github.run_number }}
          path: |
            docs/VOCABULARY_REPORT.md
            docs/CURRICULUM_LINT_REPORT.md
            docs/CURRICULUM_LINT_SUPPRESSIONS.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Run local quality tests
        if: ${{ !cancelled() }}
        run: npm run quality:tests
      - name: Generate grammar prerequisite candidate report
        if: ${{ !cancelled() }}
        run: npm run quality:grammar-prerequisites
      - name: Upload grammar prerequisite candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-prerequisite-candidates
          path: artifacts/grammar-prerequisite-candidates.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate semantic ambiguity candidate report
        if: ${{ !cancelled() }}
        run: npm run quality:ambiguity
      - name: Upload semantic ambiguity candidate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-ambiguity-candidates
          path: artifacts/semantic-ambiguity-candidates.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Run DeepSeek review packet tests
        run: node --test tests/build-deepseek-review-packet.test.mjs
      - name: Run B1 U1-U12 independent review packet tests
        run: node --test tests/build-b1-u1-u12-review-packet.test.mjs
      - name: Generate B1 U1-U12 independent review packet
        if: ${{ !cancelled() }}
        run: npm run quality:deepseek-b1-u1-u12
      - name: Upload B1 U1-U12 review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-b1-u1-u12-review-packet
          path: artifacts/deepseek-b1-u1-u12-review-packet.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Run B1 U13-U26 independent review packet tests
        run: node --test tests/build-b1-u13-u26-review-packet.test.mjs
      - name: Generate B1 U13-U26 independent review packet
        if: ${{ !cancelled() }}
        run: npm run quality:deepseek-b1-u13-u26
      - name: Upload B1 U13-U26 review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-b1-u13-u26-review-packet
          path: artifacts/deepseek-b1-u13-u26-review-packet.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Run B1 U27-U50 independent review packet tests
        run: node --test tests/build-b1-u27-u50-review-packet.test.mjs
      - name: Generate B1 U27-U50 independent review packet
        if: ${{ !cancelled() }}
        run: npm run quality:deepseek-b1-u27-u50
      - name: Upload B1 U27-U50 review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-b1-u27-u50-review-packet
          path: artifacts/deepseek-b1-u27-u50-review-packet.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate independent editorial review queue
        if: ${{ !cancelled() }}
        run: node scripts/build-editorial-review-queue.mjs --output artifacts/editorial-review-queue.csv --summary artifacts/editorial-review-summary.json
      - name: Upload editorial review queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-review-queue
          path: |
            artifacts/editorial-review-queue.csv
            artifacts/editorial-review-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare curriculum audit report directory
        if: ${{ !cancelled() }}
        run: mkdir -p artifacts
      - name: Run independent curriculum quality audit
        if: ${{ !cancelled() }}
        run: node scripts/audit-curriculum-quality.mjs --json artifacts/curriculum-quality-report.json
      - name: Upload curriculum quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-quality-report
          path: artifacts/curriculum-quality-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate unified quality report
        if: ${{ !cancelled() }}
        run: node scripts/build-unified-quality-report.mjs --audit artifacts/curriculum-quality-report.json --editorial artifacts/editorial-review-summary.json --output artifacts/unified-quality-report.json
      - name: Upload unified quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-quality-report
          path: artifacts/unified-quality-report.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate source-backed DeepSeek review packet
        if: ${{ !cancelled() }}
        run: npm run quality:deepseek-packet
      - name: Upload DeepSeek first-review packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-first-review-packet
          path: artifacts/deepseek-first-review-packet.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Run KBBI audit queue tests
        run: node --test tests/audit-kbbi-pending.test.mjs
      - name: Run assessment engine unit tests
        run: node --test tests/assessment-engine.test.cjs
      - name: Run B1 curriculum readiness tests
        run: node --test tests/b1-curriculum-readiness.test.cjs
      - name: Run curriculum release gate tests
        run: node --test tests/curriculum-release-gates.test.cjs
      - name: Run curriculum extraction integrity and offline cache tests
        run: node --test tests/curriculum-extraction.test.js
      - name: Run assessment bank structure tests
        run: npm run test:assessment
      - name: Run progressive assessment unit tests
        run: node --test tests/progressive-assessment.test.cjs
      - name: Run multi-lesson progression tests
        run: node --test tests/multi-lesson-progression.test.cjs
      - name: Run learning path progression tests
        run: node --test tests/learning-path-progression.test.mjs
      - name: Run real-browser end-to-end tests
        run: node --test tests/browser-e2e.test.cjs
      - name: Run assessment page browser tests
        run: node --test tests/assessment-page.e2e.test.cjs
      - name: Package a downloadable static preview for pull requests
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bahasa-studio-pr-${{ github.event.pull_request.number }}-preview
          path: |
            index.html
            assessment.html
            assessment-engine.js
            conversation-engine.js
            study-activity.js
            study-history.js
            adaptive-learning.js
            curriculum-a1.js
            curriculum-a2.js
            audio-engine.js
            pronunciation-engine.js
            writing-practice.js
            styles.css
            manifest.json
          if-no-files-found: error
          retention-days: 7


  quality-reports:
    name: Offline quality reports
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run blocking tracker synchronization check
        run: node scripts/check-tracker-sync.mjs
      - name: Generate informational unit contract report
        if: always()
        continue-on-error: true
        run: node scripts/unit-contract-report.mjs
      - name: Generate informational language coupling report
        if: always()
        continue-on-error: true
        run: node scripts/check-language-coupling.mjs
      - name: Upload PR4 quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr4-quality-reports
          path: |
            docs/TRACKER_SYNC_REPORT.md
            docs/UNIT_CONTRACT_REPORT.md
            docs/LANGUAGE_COUPLING_REPORT.md
          if-no-files-found: ignore
          retention-days: 14


