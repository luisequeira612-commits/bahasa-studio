name: Generate audio library

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Motor de voz (Piper oficial; Edge alternativo)
        type: choice
        options: [piper, edge, both]
        default: piper
        required: true
      mode:
        description: samples para escuchar; full genera audio; hashes solo calcula huellas sin TTS
        type: choice
        options: [samples, full, hashes]
        default: samples
        required: true
      limit:
        description: Máximo de textos en muestras (0 = todos)
        type: string
        default: '10'
        required: true
      ids:
        description: IDs exactos separados por comas (solo samples; vacío usa limit)
        type: string
        default: ''
        required: false
      voice:
        description: Voz de Edge TTS para muestras; Piper usa news_tts
        type: string
        default: id-ID-GadisNeural
        required: false
      level:
        description: Nivel o todos para generación completa
        type: choice
        options: [A1, A2, B1, B2, all]
        default: A1
        required: true
      confirm_full:
        description: Confirmo que escuché y aprobé Piper antes de regenerar la biblioteca completa
        type: boolean
        default: false
        required: true
      source_ref:
        description: Rama o ref de currículo desde la que se construirá la biblioteca de audio
        type: string
        default: main
        required: true

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: generate-audio
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ENGINE: ${{ inputs.engine }}
      MODE: ${{ inputs.mode }}
      LEVEL: ${{ inputs.level }}
      LIMIT: ${{ inputs.limit }}
      IDS: ${{ inputs.ids }}
      VOICE: ${{ inputs.voice }}
      CONFIRM_FULL: ${{ inputs.confirm_full }}
      SOURCE_REF: ${{ inputs.source_ref }}
      BAHASA_TTS_PERSIST_MODEL_CACHE: "1"
    steps:
      - name: Start execution timer
        id: clock
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Reject full generation until explicitly confirmed
        if: ${{ inputs.mode == 'full' && inputs.confirm_full != true }}
        run: |
          echo "::error::La generación completa requiere confirm_full=true y la selección previa de una voz."
          exit 1

      - name: Restrict both-engine comparison to samples
        if: ${{ inputs.engine == 'both' && inputs.mode != 'samples' }}
        run: |
          echo "::error::La opción both solo está disponible para muestras de evaluación."
          exit 1

      - name: Require Piper for production regeneration
        if: ${{ inputs.mode == 'full' && inputs.engine != 'piper' }}
        run: |
          echo "::error::La biblioteca de producción debe regenerarse con Piper."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Restore Piper voice cache
        if: ${{ inputs.mode != 'hashes' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/guardi-tts-cache
          key: guardi-piper-model-${{ runner.os }}-id_ID-news_tts-medium-v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        if: ${{ inputs.mode != 'hashes' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Prepare ephemeral model storage
        if: ${{ inputs.mode != 'hashes' }}
        shell: bash
        run: |
          CACHE_DIR="$RUNNER_TEMP/guardi-tts-cache"
          mkdir -p "$CACHE_DIR"
          {
            echo "BAHASA_TTS_MODEL_CACHE=$CACHE_DIR"
            echo "HF_HOME=$CACHE_DIR/huggingface"
            echo "HF_HUB_CACHE=$CACHE_DIR/huggingface/hub"
            echo "HUGGINGFACE_HUB_CACHE=$CACHE_DIR/huggingface/hub"
            echo "TRANSFORMERS_CACHE=$CACHE_DIR/transformers"
            echo "TORCH_HOME=$CACHE_DIR/torch"
            echo "PIP_NO_CACHE_DIR=1"
            echo "HF_HUB_DISABLE_TELEMETRY=1"
          } >> "$GITHUB_ENV"

      - name: Install selected TTS engine
        if: ${{ inputs.mode != 'hashes' }}
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          case "$ENGINE" in
            piper)
              python -m pip install --no-cache-dir "piper-tts==1.3.0"
              ;;
            edge)
              python -m pip install --no-cache-dir edge-tts
              ;;
            both)
              python -m pip install --no-cache-dir "piper-tts==1.3.0" edge-tts
              ;;
          esac
          if [[ "$ENGINE" == "piper" || "$ENGINE" == "both" ]]; then
            VOICE_DIR="$RUNNER_TEMP/guardi-tts-cache/piper"
            mkdir -p "$VOICE_DIR"
            BASE_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/id/id_ID/news_tts/medium"
            curl --fail --location --retry 3 "$BASE_URL/id_ID-news_tts-medium.onnx" -o "$VOICE_DIR/id_ID-news_tts-medium.onnx"
            curl --fail --location --retry 3 "$BASE_URL/id_ID-news_tts-medium.onnx.json" -o "$VOICE_DIR/id_ID-news_tts-medium.onnx.json"
            echo "PIPER_MODEL_PATH=$VOICE_DIR/id_ID-news_tts-medium.onnx" >> "$GITHUB_ENV"
          fi

      - name: Prepare generation branch
        shell: bash
        run: |
          if [[ "$MODE" == "samples" ]]; then
            # Sample runs are isolated from the long-lived historical branch.
            # Each run starts from current main, avoiding stale manifest conflicts.
            BRANCH="audio/tts-samples-${GITHUB_RUN_ID}"
            echo "AUDIO_BRANCH=$BRANCH" >> "$GITHUB_ENV"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH" "origin/$SOURCE_REF"
          else
            # Full/hash runs are generated from the selected source snapshot.
            # A unique branch avoids stale long-lived branches and merge conflicts.
            if [[ "$MODE" == "hashes" ]]; then
              BRANCH="audio/library-hashes-${GITHUB_RUN_ID}"
            else
              BRANCH="audio/library-$LEVEL-${GITHUB_RUN_ID}"
            fi
            echo "AUDIO_BRANCH=$BRANCH" >> "$GITHUB_ENV"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH" "origin/$SOURCE_REF"
          fi

      - name: Export manifest from curriculum and optional interactive sources
        if: ${{ inputs.mode != 'hashes' }}
        shell: bash
        run: |
          ARGS=()
          if [[ "$LEVEL" == "B2" || "$LEVEL" == "all" ]]; then
            ARGS+=(--include-b2)
          fi
          if [[ "$MODE" == "full" && "$LEVEL" == "all" ]]; then
            ARGS+=(--include-interactive)
          fi
          node scripts/export-audio-manifest.mjs "${ARGS[@]}"

      - name: Generate selected audio or refresh fingerprints
        run: |
          if [[ "$MODE" == "hashes" ]]; then
            python scripts/generate_audio.py --engine mms --hash-only
          elif [[ "$MODE" == "samples" ]]; then
            ARGS=(--mode samples --level "$LEVEL" --limit "$LIMIT" --force)
            if [[ -n "$IDS" ]]; then
              ARGS+=(--ids "$IDS")
            fi
            if [[ "$ENGINE" == "both" ]]; then
              python scripts/generate_audio.py --engine piper "${ARGS[@]}"
              python scripts/generate_audio.py --engine edge --voice "$VOICE" "${ARGS[@]}"
            else
              python scripts/generate_audio.py --engine "$ENGINE" --voice "$VOICE" "${ARGS[@]}"
            fi
          else
            python scripts/generate_audio.py --engine "$ENGINE" --mode full --level "$LEVEL" --limit 0 --force
          fi

      - name: Run audio generation tests
        run: |
          if [[ "$MODE" == "full" && "$LEVEL" == "all" ]]; then
            AUDIO_MANIFEST_INCLUDE_INTERACTIVE=1 node --test tests/audio-manifest.test.mjs
          else
            node --test tests/audio-manifest.test.mjs
          fi
          python -m unittest discover -s tests -p 'test_audio_generation.py'
          python -m unittest discover -s tests -p 'test_audio_review.py'
          python -m py_compile scripts/generate_audio.py scripts/audio_review.py scripts/auto_fix_pronunciation.py scripts/audio_batch.py

      - name: Commit generated manifest and audio
        id: commit
        shell: bash
        run: |
          if [[ "$MODE" == "samples" ]]; then
            git add audio-samples
          else
            git add audio service-worker.js
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audio: generate $ENGINE $MODE"
          git push origin "$AUDIO_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.commit.outputs.changed == 'true'
        id: pr
        shell: bash
        run: |
          if [[ "$MODE" == "samples" ]]; then
            TITLE="audio: add $ENGINE listening samples"
            BODY="Generated $LIMIT Indonesian sample clips with $ENGINE in GitHub Actions.\n\nThe clips are evaluation material only; no production player or curriculum files changed. Piper is the official voice; Edge remains the alternative."
          elif [[ "$MODE" == "hashes" ]]; then
            TITLE="audio: refresh MP3 content fingerprints"
            BODY="Refreshed SHA-256 fingerprints for the existing MP3 library. No audio was generated or downloaded and no curriculum source changed. The Service Worker cache version was advanced only if the fingerprint map changed."
          else
            TITLE="audio: generate $LEVEL library with $ENGINE"
            BODY="Generated the $LEVEL audio library with $ENGINE in GitHub Actions after the owner explicitly approved Piper samples. Review file count, size and CI before merging. No curriculum source was modified."
          fi
          EXISTING="$(gh pr list --head "$AUDIO_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "$EXISTING" ]]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "PR_URL=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            if URL="$(gh pr create --head "$AUDIO_BRANCH" --base main --title "$TITLE" --body "$BODY")"; then
              echo "PR_URL=$URL" >> "$GITHUB_OUTPUT"
            else
              COMPARE="https://github.com/luisequeira612-commits/bahasa-studio/compare/main...$AUDIO_BRANCH?expand=1"
              echo "PR_CREATE_BLOCKED=true" >> "$GITHUB_OUTPUT"
              echo "COMPARE_URL=$COMPARE" >> "$GITHUB_OUTPUT"
              echo "::warning::No se pudo crear el PR automáticamente. La rama quedó publicada; usa el enlace Compare & pull request."
            fi
          fi

      - name: Trigger regression CI for the generated branch
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: gh workflow run regression.yml --ref "$AUDIO_BRANCH"

      - name: Upload a copy of the samples for recovery
        if: always() && inputs.mode == 'samples'
        uses: actions/upload-artifact@v4
        with:
          name: indonesian-audio-samples-${{ inputs.engine }}-${{ github.run_number }}
          path: audio-samples/
          if-no-files-found: ignore
          retention-days: 7

      - name: Write run summary
        if: always()
        shell: bash
        env:
          STARTED: ${{ steps.clock.outputs.started }}
        run: |
          MINUTES="$(python -c 'import os,time; print(round((time.time()-int(os.environ.get("STARTED","0")))/60,2))')"
          echo "## Generación de audio" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tiempo transcurrido del runner: **${MINUTES} minutos aprox.**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Motor: **$ENGINE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Modo: **$MODE**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Nivel: **$LEVEL**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama: $AUDIO_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${{ steps.pr.outputs.PR_URL }}" ]]; then
            echo "- PR: ${{ steps.pr.outputs.PR_URL }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "${{ steps.pr.outputs.COMPARE_URL }}" ]]; then
            echo "- Crear PR manualmente: ${{ steps.pr.outputs.COMPARE_URL }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$MODE" == "samples" ]]; then
            echo "- Página prevista tras publicar la rama: https://luisequeira612-commits.github.io/bahasa-studio/audio-samples/" >> "$GITHUB_STEP_SUMMARY"
            echo "- La página solo estará disponible cuando el contenido llegue a la rama/carpeta publicada por GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          fi
